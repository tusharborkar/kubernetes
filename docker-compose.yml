version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: bookmark
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - app-network

  app:
    image: kubernetes-app:latest
    container_name: kubernetes-container
    ports:
      - "8080:8080"
    environment:
      #SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bookmark
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bookmark?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root12345
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
    depends_on:
      - db
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
